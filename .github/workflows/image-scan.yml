name: Image Scan

# Weekly vulnerability scan of the published images (ffmpeg and the Debian
# packages under it get CVEs between our releases). Findings go to the
# Security tab as SARIF; fixable HIGH/CRITICAL ones also fail the run so they
# are noticed.
on:
  schedule:
    - cron: '41 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: trivy (${{ matrix.tag }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        tag: [latest, dev]
    steps:
      - name: Scan ghcr.io/${{ github.repository }}:${{ matrix.tag }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ matrix.tag }}
          format: sarif
          output: trivy-${{ matrix.tag }}.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: always()
        with:
          sarif_file: trivy-${{ matrix.tag }}.sarif
          category: trivy-${{ matrix.tag }}
      - name: Fail on fixable HIGH or CRITICAL findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ matrix.tag }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'
          skip-setup-trivy: true
