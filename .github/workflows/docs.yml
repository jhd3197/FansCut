name: Docs

# Builds the MkDocs site with --strict (broken nav entries, missing pages and
# bad internal links fail) and checks the links in README.md and docs/. The
# weekly run catches external links that broke without a change here.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - '.lychee.toml'
      - '.github/workflows/docs.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# A newer push to the same pull request supersedes the run in progress.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: mkdocs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install "mkdocs-material>=9.5"
      - run: mkdocs build --strict --site-dir "$RUNNER_TEMP/site"

  links:
    name: link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml --no-progress README.md 'docs/**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
