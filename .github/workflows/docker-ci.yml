name: Docker CI

# The app image builds (UI stage and Python stage). release.yml gates on it
# and builds the published images itself; a dev -> main pull request skips
# it because the push already built that commit.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'fanscut/**'
      - 'ui/**'
      - '.github/workflows/docker-ci.yml'
  workflow_call:

concurrency:
  group: docker-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: docker build
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
