name: Frontend CI

# ESLint, the Vitest suite and the UI build. Like backend-ci.yml, release.yml
# gates on it, and a dev -> main pull request skips it because the push
# already tested that commit.
on:
  pull_request:
    paths:
      - 'ui/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_call:

concurrency:
  group: frontend-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: lint, test, build
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
