name: Release

# Branch pushes own the whole pipeline: dev publishes :dev images, a merged
# dev -> main promotion publishes :latest plus a tagged GitHub release.
on:
  push:
    branches: [dev, main]

# Serialize stable pushes together; dev pushes must not replace queued releases.
concurrency:
  group: container-release-${{ github.ref_name == 'dev' && 'dev' || 'stable' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promotion:
    name: Verify dev promotion
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require a merged dev promotion for stable releases
        if: github.ref_name != 'dev'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const base = context.ref.replace('refs/heads/', '');
            const pulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: context.sha, per_page: 100 }
            );
            const promotion = pulls.find(pull =>
              pull.merged_at && pull.merge_commit_sha === context.sha &&
              pull.base.ref === base && pull.head.ref === 'dev' &&
              pull.head.repo?.full_name === `${owner}/${repo}`
            );
            if (!promotion) {
              core.setFailed('Stable releases require a merged dev -> main PR from this repository.');
            }

  # Nothing publishes with a red suite, UI, image build or secret scan.
  backend-gate:
    name: Backend Gate
    needs: promotion
    uses: ./.github/workflows/backend-ci.yml

  frontend-gate:
    name: Frontend Gate
    needs: promotion
    uses: ./.github/workflows/frontend-ci.yml

  docker-gate:
    name: Docker Gate
    needs: promotion
    uses: ./.github/workflows/docker-ci.yml

  secret-scan-gate:
    name: Secret Scan Gate
    needs: promotion
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/secret-scan.yml

  # A run whose branch has moved on must not move the image aliases back. It
  # skips publishing instead of failing: the newer push's run publishes, and
  # the checks this commit passed stay green.
  freshness:
    name: Still the branch head
    needs: [backend-gate, frontend-gate, docker-gate, secret-scan-gate]
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - id: head
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$BRANCH has moved on to ${head:0:7}; that run publishes instead."
          fi

  publish:
    name: Publish container and release
    needs: freshness
    if: needs.freshness.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Resolve version and stamp the container source
        id: version
        run: python .github/scripts/release_version.py
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.channel }}
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=fanscut
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
      # Tag and release only after the image is out. GITHUB_TOKEN tag pushes
      # do not start another workflow.
      - name: Create stable tag and GitHub release
        if: github.ref_name != 'dev'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
      - name: Verify anonymous access to the published image
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          if ! DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker" docker manifest inspect "$IMAGE:$VERSION" > /dev/null; then
            echo "::error::The image was published but is not publicly readable. Check registry availability and set the fanscut package visibility to Public in GitHub package settings."
            exit 1
          fi
