[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fanscut"
dynamic = ["version"]
description = "Self-hosted fan cuts of shows: skip filler, keep canon, trim recaps and openings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Keep in sync with requirements.txt (the Dockerfile installs from that).
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.5",
    "httpx>=0.27",  # TestClient transport
    "responses>=0.25",  # mock HTTP for the clients and catalogues
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests>=2.31",
    "types-PyYAML>=6",
]

[project.scripts]
fanscut = "fanscut.cli:main"

[project.urls]
Homepage = "https://github.com/jhd3197/FansCut"
Issues = "https://github.com/jhd3197/FansCut/issues"

[tool.setuptools.packages.find]
include = ["fanscut", "fanscut.*"]

[tool.setuptools.dynamic]
version = { attr = "fanscut.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: needs a real ffmpeg binary (skipped when it is missing)"]

[tool.coverage.run]
source = ["fanscut"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["fanscut"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
